# ARK Survival Ascended (asa)
# https://github.com/Acekorneya/Ark-Survival-Ascended-Server

services:
  asa-server:
    image: acekorneya/asa_server:2_1_latest
    container_name: asa-server
    restart: unless-stopped
    stop_grace_period: 210s
    env_file: .env
    ports:
      - "${ASA_PORT:-7777}:${ASA_PORT:-7777}/tcp"
      - "${ASA_PORT:-7777}:${ASA_PORT:-7777}/udp"
      - "${RCON_PORT:-27020}:${RCON_PORT:-27020}/tcp"
    volumes:
      # game/server installation
      - /mnt/mounted-raid/arksurvivalascended/data/server:/home/pok/arkserver
      # save games + GameUserSettings.ini / Game.ini live here
      - /mnt/mounted-raid/arksurvivalascended/data/saves:/home/pok/arkserver/ShooterGame/Saved
    env_file:
      - .env
      - path: .env.local # create it manually to manage mods
        required: false
    security_opt:
      - seccomp=unconfined
    mem_limit: 16G
    mem_reservation: 12G
