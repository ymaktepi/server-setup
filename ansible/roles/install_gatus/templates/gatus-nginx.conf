# Public instance: the DMZ Traefik sends status.courgettes.club here (the
# UniFi firewall only lets it reach this CT on 443: network-bole).
server {
  listen 443 ssl http2;
  server_name status.courgettes.club;
  include snippets/self-signed.conf;
  include snippets/ssl-params.conf;

  allow {{hostvars['host_traefik_dmz']['ansible_host']}};
  deny all;

  location / {
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   Host $host;
    proxy_pass         http://127.0.0.1:8081;
  }
}

# Internal instance: everything else (status.local.courgettes.club through
# the internal Traefik, /metrics for VictoriaMetrics by IP)
server {
  listen 443 ssl http2 default_server;
  server_name _;
  include snippets/self-signed.conf;
  include snippets/ssl-params.conf;

  allow {{hostvars['host_traefik_default']['ansible_host']}};
{% if 'host_monitoring' in hostvars %}
  allow {{hostvars['host_monitoring']['ansible_host']}};
{% endif %}
  deny all;

  location / {
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   Host $host;
    proxy_pass         http://127.0.0.1:8080;
  }
}
