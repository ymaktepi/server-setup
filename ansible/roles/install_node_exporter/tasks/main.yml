# Debian's package: no recommends, which would pull in
# prometheus-node-exporter-collectors (smartmon & co, failing in LXCs)
- name: Install node_exporter
  apt:
    name:
      - prometheus-node-exporter
    state: latest
    install_recommends: false
    update_cache: true
    cache_valid_time: 86400

# systemd collector: failed units show up (off by default)
- name: Configure node_exporter
  copy:
    content: |
      ARGS="--web.listen-address={{ node_exporter_listen_address }} --collector.systemd"
    dest: /etc/default/prometheus-node-exporter
    owner: root
    group: root
    mode: 0644
  register: node_exporter_config

- name: Enable and run node_exporter
  ansible.builtin.systemd_service:
    name: prometheus-node-exporter
    state: "{{ 'restarted' if node_exporter_config.changed else 'started' }}"
    enabled: true
