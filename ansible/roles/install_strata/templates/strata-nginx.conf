
server {
  listen 443 ssl http2;
  # Remove '#' in the next line to enable IPv6
  # listen [::]:443 ssl http2;
  server_name {{ansible_host}} strata.local-dmz.courgettes.club;
  include snippets/self-signed.conf;
  include snippets/ssl-params.conf;

  # only allow traffic from the traefik VM
  # since it now handles potential authentication and we have external people in other DMZ VMs.
  allow {{hostvars['host_traefik_dmz']['ansible_host']}};
  deny all;

  # long prompts and pasted files
  client_max_body_size 64m;

  location / {
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   Host $host;
    proxy_pass         http://localhost:{{ strata_port }}/;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection "upgrade";

    # streamed answers, and a first message reads at ~1 minute per 30K tokens
    proxy_buffering    off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
}
