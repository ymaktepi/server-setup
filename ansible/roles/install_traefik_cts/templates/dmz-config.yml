http:
  #region routers
  routers:
    traefik-secure:
      entryPoints:
        - "https"
      rule: "Host(`traefik.local-dmz.courgettes.club`)"
      middlewares:
        - traefik-auth
        - localipwhitelist
      service: api@internal
      tls:
        certResolver: infomaniak
        domains:
          - main: local-dmz.courgettes.club
            sans:
              - "*.local-dmz.courgettes.club"
    #grafana:
    #  entryPoints:
    #    - "https"
    #  rule: "Host(`grafana.courgettes.club`)"
    #  middlewares:
    #    - default-headers
    #  tls:
    #    certresolver: letsencrypt
    #  service: grafana
    airhorn:
      entryPoints:
        - "https"
      rule: "Host(`airhorn.courgettes.club`) || Host(`airhorn.wav.courgettes.club`)"
      middlewares:
        - default-headers
        - wav-to-airhorn-redirection
      tls:
        certresolver: letsencrypt
      service: websites-nico
    egj:
      entryPoints:
        - "https"
      rule: "Host(`egj2021.courgettes.club`)"
      middlewares:
        - default-headers
      tls:
        certresolver: letsencrypt
      service: websites-nico
    arr:
      entryPoints:
        - "https"
      rule: "Host(`sonarr.local-dmz.courgettes.club`) || Host(`radarr.local-dmz.courgettes.club`) || Host(`prowlarr.local-dmz.courgettes.club`) || Host(`qbittorrent.local-dmz.courgettes.club`) || Host(`jellyseerr.local-dmz.courgettes.club`)"
      middlewares:
        - local-only
        - default-headers
      tls:
        certresolver: infomaniak
      service: websites-arr
    it-tools:
      entryPoints:
        - "https"
      rule: "Host(`it-tools.courgettes.club`)"
      middlewares:
        - default-headers
      tls:
        certresolver: letsencrypt
      service: websites-nico
    nextcloud:
      entryPoints:
        - "https"
      rule: "Host(`nextcloud.courgettes.club`)"
      middlewares:
        - default-headers
        - www-to-non-www-redirection
      tls:
        certresolver: letsencrypt
      service: nextcloud
    courgettes:
      entryPoints:
        - "https"
      rule: "Host(`courgettes.club`) || Host(`www.courgettes.club`)"
      middlewares:
        - default-headers
        - www-to-non-www-redirection
      tls:
        certresolver: letsencrypt
      service: websites-nico
    budget:
      entryPoints:
        - "https"
      rule: "Host(`budget.courgettes.club`)"
      middlewares:
        - default-headers
        - www-to-non-www-redirection
      tls:
        certresolver: letsencrypt
      service: websites-nico
    contra:
      entryPoints:
        - "https"
      rule: "Host(`contra.courgettes.club`)"
      middlewares:
        - default-headers
        - www-to-non-www-redirection
      tls:
        certresolver: letsencrypt
      service: websites-nico
    test:
      entryPoints:
        - "https"
      rule: "Host(`test.courgettes.club`) || Host(`www.test.courgettes.club`)"
      middlewares:
        - default-headers
        - www-to-non-www-redirection
      tls:
        certresolver: letsencrypt
      service: websites-nico
    pocket:
      entryPoints:
        - "https"
      rule: "Host(`mouni.courgettes.club`)"
      middlewares:
        - default-headers
        - www-to-non-www-redirection
      tls:
        certresolver: letsencrypt
      service: websites-pocket
    pocket-planet-designer:
      entryPoints:
        - "https"
      rule: "Host(`planet-designer.courgettes.club`)"
      middlewares:
        - default-headers
        - www-to-non-www-redirection
      tls:
        certresolver: letsencrypt
      service: websites-pocket
    gpu:
      entryPoints:
        - "https"
      rule: "Host(`ollama.local-dmz.courgettes.club`) || Host(`tabby.local-dmz.courgettes.club`) || Host(`strata.local-dmz.courgettes.club`)"
      middlewares:
        - local-only
        - default-headers
        - www-to-non-www-redirection
      tls:
        certresolver: infomaniak
      service: gpu
    # Public: login is LDAP (lldap on the VPS, jellyfin_users only) inside Jellyfin
    # itself; no Authelia in front, the TV/mobile apps can't do it.
    jellyfin:
      rule: "Host(`jellyfin.courgettes.club`)"
      entryPoints:
        - "https"
      middlewares:
        - default-headers
      service: jellyfin
      tls:
        certResolver: letsencrypt
    status:
      rule: "Host(`status.courgettes.club`)"
      entryPoints:
        - "https"
      middlewares:
        - default-headers
        - uptime-kuma-host
      service: status
      tls:
        certResolver: letsencrypt
  #endregion
  #region services
  services:
    #grafana:
    #  loadBalancer:
    #    servers:
    #      - url: "http://10.10.5.10"
    #    passHostHeader: true
    websites-nico:
      loadBalancer:
        servers:
          - url: "https://{{hostvars['host_websites']['ansible_host']}}"
        passHostHeader: true
    websites-arr:
      loadBalancer:
        servers:
          - url: "https://{{hostvars['host_arr_server']['ansible_host']}}"
        passHostHeader: true
    gpu:
      loadBalancer:
        servers:
          - url: "https://{{hostvars['host_gpu']['ansible_host']}}"
        passHostHeader: true
    nextcloud:
      loadBalancer:
        servers:
          - url: "https://{{hostvars['host_nextcloud']['ansible_host']}}"
        passHostHeader: true
    websites-pocket:
      loadBalancer:
        servers:
          - url: "https://{{hostvars['host_pocket']['ansible_host']}}"
        passHostHeader: true
    # minix's nginx, which knows jellyfin.courgettes.club as a server_name.
    # Reachable from here thanks to a UniFi policy (tofu: network-bole/firewall_policies.tofu).
    jellyfin:
      loadBalancer:
        servers:
          - url: "https://{{hostvars['host_minix']['ansible_host']}}"
        passHostHeader: true
    # Straight to Uptime Kuma's nginx, not via traefik_default: the firewall
    # only lets this Traefik reach that one container (tofu:
    # network-bole/firewall_policies.tofu), since traefik_default fronts every
    # internal UI. Host is set to what Kuma saw when this went through
    # traefik_default (uptime-kuma-host), in case a status page is mapped to it.
    status:
      loadBalancer:
        servers:
          - url: "https://{{hostvars['host_uptime_kuma']['ansible_host']}}"
        passHostHeader: true
  #endregion
  middlewares:
    uptime-kuma-host:
      headers:
        customRequestHeaders:
          Host: "uptime-status.local.courgettes.club"

    traefik-auth:
      basicAuth:
        users:
          - "admin:{{traefik_basic_auth}}"

    localipwhitelist:
      ipAllowList:
        sourceRange:
          - "10.10.0.0/23"

    # Redirect www URLs to their non-www equivalent
    # Use with traefik.http.routers.myRouter.middlewares: "redirect-www-to-non-www@file"
    www-to-non-www-redirection:
      # Redirect a request from an url to another with regex matching and replacement
      redirectregex:
        # Apply a permanent redirection (HTTP 301)
        permanent: true
        # The regular expression to match and capture elements from the request URL
        regex: "^https?://www\\.(.+)"
        # How to modify the URL to have the new target URL
        replacement: "https://${1}"

    wav-to-airhorn-redirection:
      redirectregex:
        permanent: true
        regex: "^https:?://airhorn.courgettes.club"
        replacement: "https://airhorn.wav.courgettes.club"

    # Bole Default, Entertainment, DMZ, plus the laptop at Salon (arrives
    # un-NATed over site-to-site)
    local-only:
      ipAllowList:
        sourceRange:
          - "10.10.0.0/23"
          - "10.10.2.0/24"
          - "10.10.5.0/24"
          - "10.20.0.0/23"

    default-headers:
      headers:
        frameDeny: true
        browserXssFilter: true
        contentTypeNosniff: true
        forceSTSHeader: true
        stsIncludeSubdomains: true
        stsPreload: true
        stsSeconds: 15552000
        customFrameOptionsValue: SAMEORIGIN
        customRequestHeaders:
          "X-Forwarded-Proto": https
