
server {
  listen 443 ssl http2;
  # Remove '#' in the next line to enable IPv6
  # listen [::]:443 ssl http2;
  server_name {{ansible_host}};
  include snippets/self-signed.conf;
  include snippets/ssl-params.conf;

  # only allow traffic from the traefiks: internal (uptime*.local.courgettes.club)
  # and DMZ, which serves the public status page straight from here
  allow {{hostvars['host_traefik_default']['ansible_host']}};
  allow {{hostvars['host_traefik_dmz']['ansible_host']}};
  deny all;

  location / {
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   Host $host;
    proxy_pass         http://localhost:3001/;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection "upgrade";
  }
}