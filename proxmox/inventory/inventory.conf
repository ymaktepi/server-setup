[pvenodes]
# not recommended to rename a node that has workloads running. might change that later if backups are working.
host_main_node ansible_host=10.10.0.100 proxmox_node_name=proxmox  has_gpu=yes
host_node_2    ansible_host=10.10.0.101 proxmox_node_name=proxmox2 has_gpu=no
host_node_3    ansible_host=10.10.0.103 proxmox_node_name=proxmox3 has_gpu=no
host_node_4    ansible_host=10.10.0.102 proxmox_node_name=proxmox4 has_gpu=no

[pvenodes:vars]
ansible_user=ansible
# where to store the containers images
cts_storage=synology
# where to store the vm base images and cloud init
image_path=/mnt/pve/cluster-isos/isos/images/0/
# where to store snippets
snippets_storage=cluster-snippets
snippets_path=/hdd-8tb-raid/snippets/snippets/
# default boot drive for vms and cts
disk_storage=m2-noraid
drive_format=qcow2
main_node_mounted_disk_storage=hdd-8tb-raid
synology_mounted_disk_storage=synology
linux_bridge=vmbr0

[minix]
host_minix ansible_host=10.10.0.201 ansible_user=ymaktepi

# todo: migrate
[gpu]
host_gpu ansible_host=10.10.5.102 ansible_user=root

[infomaniak]
# assumes that the host exists in .ssh/config
# uses 1password ssh agent
infomaniak_vps
